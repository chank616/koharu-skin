spring:
  config:
    import: optional:file:./application-local.properties
  application:
    name: koharu-skin
  mvc:
    formcontent:
      filter:
        enabled: false # PUT/DELETE 表单由 DTO 转换器读取，避免请求体被提前消耗。
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/koharu_skin}
    username: ${DB_USERNAME:koharu_skin}
    password: ${DB_PASSWORD:}
  threads:
    virtual:
      enabled: true
  sql:
    init:
      mode: always
      schema-locations: classpath:db/yggdrasil.sql,classpath:db/oauth.sql
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  servlet:
    session:
      timeout: 120m
      cookie:
        http-only: true
        same-site: lax

mybatis:
  configuration:
    map-underscore-to-camel-case: true

koharu:
  oauth-public-key: ${OAUTH_PUBLIC_KEY:}
  skin-api-tokens: ${SKIN_API_TOKENS:}
  remember-key: ${REMEMBER_KEY}
  public-url: ${PUBLIC_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:noreply@localhost}

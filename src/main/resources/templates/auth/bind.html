<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head th:replace="~{fragments/assets :: head(${translations.text('auth.bind.title')})}"></head>
<body class="hold-transition login-page">
<div class="login-box">
    <div class="login-logo"><a th:href="@{/}" th:text="${siteName}"></a></div>
    <div class="card"><div class="card-body login-card-body">
        <h1 class="h5" th:text="${translations.text('auth.bind.title')}">绑定邮箱</h1><p th:text="${translations.text('auth.bind.message')}"></p>
        <form method="post" th:action="@{/auth/bind}">
            <input class="form-control mb-3" type="email" name="email" th:value="${binding != null ? binding.email : ''}" th:placeholder="${translations.text('auth.email')}" maxlength="100" autocomplete="email" required>
            <p th:text="${translations.text('koharu.auth.bind-introduction')}"></p>
            <p th:if="${errorMessage}" th:text="${errorMessage}" class="alert alert-warning"></p>
            <button type="submit" class="btn btn-primary btn-block" th:text="${translations.text('auth.bind.title')}">绑定邮箱</button>
        </form>
        <form method="post" th:action="@{/auth/logout}" class="mt-3"><button type="submit" class="btn btn-link btn-block" th:text="${translations.text('general.logout')}">退出登录</button></form>
    </div></div>
</div>
<th:block th:replace="~{fragments/assets :: scripts}"></th:block>
</body>
</html>

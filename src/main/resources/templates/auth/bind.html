<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/assets :: head('绑定邮箱')}"></head>
<body class="hold-transition login-page">
<div class="login-box">
    <div class="login-logo"><a th:href="@{/}" th:text="${siteName}"></a></div>
    <div class="card"><div class="card-body login-card-body">
        <h1 class="h5">绑定邮箱</h1><p>你的账号尚未绑定邮箱，请填写常用邮箱以继续使用。</p>
        <form method="post" th:action="@{/auth/bind}">
            <input class="form-control mb-3" type="email" name="email" th:value="${binding != null ? binding.email : ''}" placeholder="邮箱地址" maxlength="100" autocomplete="email" required>
            <p>绑定后可使用邮箱登录和找回密码，原有角色与材质会保留。</p>
            <p th:if="${errorMessage}" th:text="${errorMessage}" class="alert alert-warning"></p>
            <button type="submit" class="btn btn-primary btn-block">绑定邮箱</button>
        </form>
        <form method="post" th:action="@{/auth/logout}" class="mt-3"><button type="submit" class="btn btn-link btn-block">退出登录</button></form>
    </div></div>
</div>
<th:block th:replace="~{fragments/assets :: scripts}"></th:block>
</body>
</html>

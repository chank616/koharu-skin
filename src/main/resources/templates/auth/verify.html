<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head th:replace="~{fragments/assets :: head(${translations.text('auth.verify.title')})}"></head>
<body class="hold-transition login-page">
<div class="login-box">
    <div class="login-logo"><a th:href="@{/}" th:text="${siteName}"></a></div>
    <div class="card"><div class="card-body login-card-body">
        <h1 class="h5" th:text="${translations.text('auth.verify.title')}">验证邮箱</h1><p th:text="${translations.text('koharu.auth.verify-instruction')}"></p>
        <form method="post" th:action="@{/auth/verify/{uid}(uid=${verificationUid},expires=${expires},signature=${signature})}">
            <input class="form-control mb-3" type="email" name="email" th:placeholder="${translations.text('auth.email')}" maxlength="100" required>
            <p th:if="${errorMessage}" th:text="${errorMessage}" class="alert alert-warning"></p>
            <button type="submit" class="btn btn-primary btn-block" th:text="${translations.text('general.submit')}">确认验证</button>
        </form>
    </div></div>
</div>
<th:block th:replace="~{fragments/assets :: scripts}"></th:block>
</body>
</html>

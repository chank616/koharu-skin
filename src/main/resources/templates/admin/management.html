<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/assets :: head(${title})}"></head>
<body class="hold-transition layout-top-nav" th:classappend="${darkMode} ? 'dark-mode'">
<div class="wrapper">
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <div class="container-fluid"><a th:href="@{/user}" class="navbar-brand" th:text="${siteName}"></a>
            <a th:href="@{/user}" class="nav-link">用户中心</a>
            <a th:href="@{/admin/users}" class="nav-link">用户管理</a>
            <a th:href="@{/admin/players}" class="nav-link">角色管理</a>
            <a th:href="@{/admin/options}" class="nav-link">站点设置</a><a th:href="@{/admin/score}" class="nav-link">积分设置</a>
            <a th:href="@{/admin/extensions}" class="nav-link">官方扩展</a>
            <button id="logout-button" class="btn btn-outline-secondary ml-auto">退出登录</button></div>
    </nav>
    <div class="content-wrapper">
        <section class="content-header"><h1 class="h3" th:text="${title}"></h1></section>
        <section class="content"><div class="container-fluid"></div></section>
    </div>
</div>
<th:block th:replace="~{fragments/assets :: scripts}"></th:block>
</body>
</html>

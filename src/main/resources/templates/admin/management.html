<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head th:replace="~{fragments/assets :: head(${title})}"></head>
<body class="hold-transition layout-top-nav" th:classappend="${darkMode} ? 'dark-mode'">
<div class="wrapper">
    <nav class="main-header navbar navbar-expand" th:classappend="${siteAssets.navbar}">
        <div class="container-fluid"><a th:href="@{/user}" class="navbar-brand" th:text="${siteName}"></a>
            <a th:href="@{/user}" class="nav-link" th:text="${translations.text('general.user-center')}">用户中心</a>
            <a th:href="@{/admin}" class="nav-link" th:text="${translations.text('general.admin-panel')}">后台首页</a><a th:href="@{/admin/users}" class="nav-link" th:text="${translations.text('general.user-manage')}">用户管理</a>
            <a th:href="@{/admin/players}" class="nav-link" th:text="${translations.text('general.player-manage')}">角色管理</a>
            <a th:href="@{/admin/reports}" class="nav-link" th:text="${translations.text('general.report-manage')}">举报审核</a>
            <a th:href="@{/admin/options}" class="nav-link" th:text="${translations.text('general.options')}">站点设置</a><a th:href="@{/admin/score}" class="nav-link" th:text="${translations.text('general.score-options')}">积分设置</a>
            <a th:href="@{/admin/extensions}" class="nav-link" th:text="${translations.text('koharu.extensions.title')}">官方扩展</a>
            <th:block th:replace="~{fragments/notifications :: bell}"></th:block><button id="logout-button" class="btn btn-outline-secondary ml-auto" th:text="${translations.text('general.logout')}">退出登录</button></div>
    </nav>
    <div class="content-wrapper">
        <section class="content-header"><h1 class="h3" th:text="${title}"></h1></section>
        <section class="content"><div class="container-fluid"></div></section>
    </div>
</div>
<th:block th:replace="~{fragments/assets :: scripts}"></th:block>
</body>
</html>

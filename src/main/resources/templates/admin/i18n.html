<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head th:replace="~{fragments/assets :: head(${title})}"></head>
<body class="hold-transition layout-top-nav" th:classappend="${darkMode} ? 'dark-mode'">
<div class="wrapper">
    <nav class="main-header navbar navbar-expand" th:classappend="${siteAssets.navbar}"><div class="container">
        <a th:href="@{/user}" class="navbar-brand" th:text="${siteName}"></a><a th:href="@{/admin}" class="nav-link" th:text="${translations.text('general.admin-panel')}">后台首页</a>
        <a th:href="@{/admin/options}" class="nav-link" th:text="${translations.text('general.options')}">站点设置</a>
        <button id="logout-button" class="btn btn-outline-secondary ml-auto" th:text="${translations.text('general.logout')}">退出登录</button>
    </div></nav>
    <div class="content-wrapper"><section class="content pt-4"><div class="container">
        <h1 class="h3 mb-3" th:text="${title}"></h1>
        <form method="get" th:action="@{/admin/i18n}" class="form-inline mb-3">
            <label for="lang" class="mr-2">编辑语言</label>
            <select id="lang" name="lang" class="form-control mr-2"><option th:each="language : ${languages}" th:value="${language.key}" th:text="${language.value}" th:selected="${language.key==blessing.locale}"></option></select>
            <button class="btn btn-secondary" type="submit">切换</button>
        </form>
        <div class="row"><div class="col-lg-8"><div id="table" class="card"></div></div><div class="col-lg-4">
            <form class="card" method="post" th:action="@{/admin/i18n}" th:object="${translationForm}">
                <div class="card-header"><h2 class="card-title" th:text="${translations.text('admin.i18n.add')}"></h2></div>
                <div class="card-body">
                    <div class="alert alert-success" th:if="${translationAdded}" th:text="${translations.text('admin.i18n.added')}"></div>
                    <div class="alert alert-danger" th:if="${translationError}" th:text="${translationError}"></div>
                    <div class="form-group"><label for="group" th:text="${translations.text('admin.i18n.group')}"></label><input id="group" th:field="*{group}" maxlength="255" required class="form-control"></div>
                    <div class="form-group"><label for="key" th:text="${translations.text('admin.i18n.key')}"></label><input id="key" th:field="*{key}" maxlength="255" required class="form-control"></div>
                    <div class="form-group"><label for="text" th:text="${translations.text('admin.i18n.text')}"></label><textarea id="text" th:field="*{text}" required class="form-control" rows="4"></textarea></div>
                </div><div class="card-footer"><button class="btn btn-primary" th:text="${translations.text('general.submit')}"></button></div>
            </form>
        </div></div>
    </div></section></div>
</div><th:block th:replace="~{fragments/assets :: scripts}"></th:block>
</body></html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/assets :: head(${title})}"></head>
<body class="hold-transition layout-top-nav" th:classappend="${darkMode} ? 'dark-mode'">
<div class="wrapper">
    <nav class="main-header navbar navbar-expand" th:classappend="${siteAssets.navbar}"><div class="container">
        <a th:href="@{/user}" class="navbar-brand" th:text="${siteName}"></a>
        <a th:href="@{/admin}" class="nav-link">后台首页</a><a th:href="@{/admin/users}" class="nav-link">用户管理</a><a th:href="@{/admin/players}" class="nav-link">角色管理</a>
        <a th:href="@{/admin/options}" class="nav-link">站点设置</a><a th:href="@{/admin/score}" class="nav-link">积分设置</a>
        <a th:href="@{/admin/customize}" class="nav-link">外观设置</a>
        <a th:href="@{/admin/resource}" class="nav-link">资源设置</a>
        <a th:href="@{/admin/extensions}" class="nav-link">官方扩展</a>
        <th:block th:replace="~{fragments/notifications :: bell}"></th:block><button id="logout-button" class="btn btn-outline-secondary ml-auto">退出登录</button>
    </div></nav>
    <div class="content-wrapper"><section class="content pt-4"><div class="container">
        <h1 class="h3 mb-3" th:text="${title}"></h1>
        <p th:if="${section=='extensions/config'}"><a th:href="@{/admin/yggdrasil-log}">查看外置登录日志</a></p>
        <div class="alert alert-success" role="status" th:if="${param.saved != null}">设置已保存</div>
        <div class="alert alert-danger" role="alert" th:if="${error != null}" th:text="${error}"></div>
        <form class="card" method="post" th:action="@{'/admin/'+${section}}" th:each="group : ${groups}" th:id="${group.key}">
            <input type="hidden" name="option" th:value="${group.key}">
            <div class="card-header"><h2 class="card-title" th:text="${group.title}"></h2></div>
            <div class="card-body">
                <div class="form-group" th:each="field : ${group.fields}" th:switch="${field.type}">
                    <label th:for="${field.key}" th:text="${field.label}"></label>
                    <input th:case="'checkbox'" type="checkbox" class="ml-2" th:id="${field.key}" th:name="${field.key}" value="true" th:checked="${values[field.key] == 'true'}">
                    <textarea th:case="'textarea'" class="form-control" rows="4" th:id="${field.key}" th:name="${field.key}" th:text="${values[field.key]}"></textarea>
                    <select th:case="'rule'" class="form-control" th:id="${field.key}" th:name="${field.key}">
                        <option value="official" th:selected="${values[field.key]=='official'}">英文、数字与下划线</option>
                        <option value="cjk" th:selected="${values[field.key]=='cjk'}">允许中文</option>
                        <option value="utf8" th:selected="${values[field.key]=='utf8'}">允许非空白 Unicode 字符</option>
                        <option value="custom" th:selected="${values[field.key]=='custom'}">自定义正则</option>
                    </select>
                    <select th:case="'status'" class="form-control" th:id="${field.key}" th:name="${field.key}">
                        <option value="403" th:selected="${values[field.key]=='403'}">403 禁止访问</option>
                        <option value="404" th:selected="${values[field.key]=='404'}">404 未找到</option>
                    </select>
                    <select th:case="'uuid'" class="form-control" th:id="${field.key}" th:name="${field.key}">
                        <option value="v4" th:selected="${values[field.key]=='v4'}">随机 UUID（v4）</option>
                        <option value="v3" th:selected="${values[field.key]=='v3'}">离线模式 UUID（v3）</option>
                    </select>
                    <select th:case="'color'" class="form-control" th:id="${field.key}" th:name="${field.key}">
                        <option th:each="color : ${navbarColors}" th:value="${color.key}" th:text="${color.key}" th:selected="${values[field.key]==color.key}"></option>
                    </select>
                    <input th:case="*" class="form-control" th:type="${field.type=='integer'?'number':field.type}" th:id="${field.key}" th:name="${field.key}" th:value="${values[field.key]}" th:min="${field.type=='number'?0:null}" th:autocomplete="${field.type=='password'?'new-password':null}">
                </div>
            </div><div class="card-footer"><button class="btn btn-primary" type="submit">保存设置</button></div>
        </form>
        <div class="card" th:if="${section=='extensions/config'}">
            <div class="card-header"><h2 class="card-title">联盟成员操作</h2></div>
            <div class="card-body">
                <p th:unless="${unionNetworkEnabled}" class="text-warning">当前环境已关闭联盟网络连接。</p>
                <p th:unless="${unionEnabled}">请先在官方扩展中启用联合认证。</p>
                <p th:if="${unionMessage}" th:text="${unionMessage}" class="alert alert-success"></p>
                <p>更新签名密钥会使用联盟提供的私钥；同步角色会向联盟提交本站角色名和 UUID。</p>
                <p th:if="${unionEnabled}"><a th:href="@{/admin/union/view/blacklist}">管理联盟黑名单</a></p>
                <div class="d-flex flex-wrap">
                    <form class="mr-2 mb-2" method="post" th:action="@{/admin/union/member/updatelist}"><button class="btn btn-primary" th:disabled="${!unionNetworkEnabled or !unionEnabled}">更新成员列表</button></form>
                    <form class="mr-2 mb-2" method="post" th:action="@{/admin/union/member/updateprivatekey}"><button class="btn btn-warning" th:disabled="${!unionNetworkEnabled or !unionEnabled}">更新签名密钥</button></form>
                    <form class="mr-2 mb-2" method="post" th:action="@{/admin/union/member/sync}"><button class="btn btn-primary" th:disabled="${!unionNetworkEnabled or !unionEnabled}">同步角色</button></form>
                    <form class="mr-2 mb-2" method="post" th:action="@{/admin/union/member/diagnose}"><button class="btn btn-outline-primary" th:disabled="${!unionNetworkEnabled or !unionEnabled}">连接诊断</button></form>
                </div>
            </div>
        </div>
    </div></section></div>
</div>
<th:block th:replace="~{fragments/assets :: scripts}"></th:block>
</body></html>

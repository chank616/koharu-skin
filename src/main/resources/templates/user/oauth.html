<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head th:replace="~{fragments/assets :: head(${translations.text('general.oauth-manage')})}"></head>
<body class="hold-transition layout-top-nav" th:classappend="${darkMode} ? 'dark-mode'">
<div class="wrapper">

        <a th:href="@{/user}" class="navbar-brand" th:text="${siteName}"></a>

    <div class="content-wrapper"><div class="content-header"><div class="container-fluid"><h1 class="h3" th:text="${translations.text('general.oauth-manage')}">OAuth 应用管理</h1></div></div>

</div><th:block th:replace="~{fragments/assets :: scripts}"></th:block>

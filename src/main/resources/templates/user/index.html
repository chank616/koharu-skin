<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/assets :: head('用户中心')}"></head>
<body class="hold-transition layout-top-nav" th:classappend="${darkMode} ? 'dark-mode'">
<div class="wrapper">
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <div class="container">
            <a class="navbar-brand" th:href="@{/user}" th:text="${siteName}">Koharu Skin</a>
            <a class="nav-link" th:href="@{/user/player}">角色管理</a>
            <a class="nav-link" th:href="@{/user/closet}">我的衣柜</a>
            <a class="nav-link" th:href="@{/skinlib}">皮肤库</a>
            <a class="nav-link" th:href="@{/user/profile}">个人资料</a>
            <a class="nav-link" th:href="@{/user/reports}">我的举报</a>
            <a class="nav-link" th:if="${admin}" th:href="@{/admin}">管理后台</a>
            <th:block th:replace="~{fragments/notifications :: bell}"></th:block><button id="logout-button" type="button" class="btn btn-outline-secondary ml-auto">退出登录</button>
        </div>
    </nav>
    <div class="content-wrapper"><section class="content pt-4"><div class="container">
        <div class="card"><div class="card-body">
            <h1 class="h4" th:text="${account.nickname}"></h1>
            <p th:text="${account.email}"></p>
            <span>用户 ID：</span><span th:text="${account.uid}"></span>
        </div></div>
        <div id="usage-box"></div>
        <div id="email-verification"></div>
        <p th:if="${xiqueerEnabled and extra.unverified}"><a th:href="@{/user/xiqueer-verification}">使用喜鹊儿 APP 扫码验证学生邮箱</a></p>
        <div class="card" th:if="${yggUrl != null}"><div class="card-header"><h2 class="card-title">启动器外置登录</h2></div><div class="card-body">
            <p>在支持 authlib-injector 的启动器中添加认证服务器，使用本站邮箱或角色名及密码登录。</p>
            <label for="ygg-address">认证服务器地址</label><input id="ygg-address" class="form-control" readonly th:value="${yggUrl}">
        </div></div>
    </div></section></div>
</div>
<th:block th:replace="~{fragments/assets :: scripts}"></th:block>
<div id="modal-score-instruction" class="modal fade" tabindex="-1" role="dialog" aria-label="积分说明">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">积分说明</h5><button class="close" data-dismiss="modal" aria-label="关闭">×</button></div>
        <div class="modal-body"><p>通过签到获得积分，用于添加角色、上传材质和收藏。各项消耗由站点设置决定。</p>
            <p th:each="rate : ${rates}"><span th:text="${rate.key}"></span>：<span th:text="${rate.value}"></span> 积分</p>
        </div>
        <div class="modal-footer"><button class="btn btn-default" data-dismiss="modal">关闭</button></div>
    </div></div>
</div>
</body>
</html>

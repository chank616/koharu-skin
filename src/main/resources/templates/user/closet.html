<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head th:replace="~{fragments/assets :: head(${translations.text('general.my-closet')})}"></head>
<body class="hold-transition layout-top-nav" th:classappend="${darkMode} ? 'dark-mode'">
<div class="wrapper">
    <nav class="main-header navbar navbar-expand" th:classappend="${siteAssets.navbar}"><div class="container">
        <a th:href="@{/user}" class="navbar-brand" th:text="${siteName}"></a>
        <a th:href="@{/user}" class="nav-link" th:text="${translations.text('general.user-center')}">用户中心</a><a th:href="@{/user/player}" class="nav-link" th:text="${translations.text('general.player-manage')}">角色管理</a>
        <a th:href="@{/skinlib}" class="nav-link" th:text="${translations.text('general.skinlib')}">皮肤库</a>
        <th:block th:replace="~{fragments/notifications :: bell}"></th:block><button id="logout-button" class="btn btn-outline-secondary ml-auto" th:text="${translations.text('general.logout')}">退出登录</button>
    </div></nav>
    <div class="content-wrapper"><section class="content pt-4"><div class="container">
        <h1 class="h3 mb-3" th:text="${translations.text('general.my-closet')}">我的衣柜</h1>
        <div id="email-verification"></div>
        <div class="row"><div class="col-md-8" id="closet-list"></div><div class="col-md-4" id="previewer"></div></div>
    </div></section></div>
</div>
<th:block th:replace="~{fragments/assets :: scripts}"></th:block>
</body>
</html>

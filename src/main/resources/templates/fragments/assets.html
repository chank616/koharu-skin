<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" th:content="${siteAssets.description}">
    <meta name="keywords" th:content="${siteAssets.keywords}">
    <meta name="theme-color" th:content="${siteAssets.themeColor}">
    <th:block th:utext="${siteAssets.meta}"></th:block>
    <meta name="csrf-token" th:content="${_csrf.token}">
    <title th:text="${blessing.route=='/'?siteName:title + ' - ' + siteName}">Koharu Skin</title>
    <link th:if="${siteAssets.cdn!=''}" rel="preconnect" id="cdn-host" th:href="${siteAssets.cdn}" crossorigin="anonymous">
    <link rel="stylesheet" th:href="${siteAssets.cdn+'/app/style.css'}" crossorigin="anonymous">
    <link rel="icon" th:if="${favicon != ''}" th:href="${favicon}">
    <link rel="stylesheet" th:if="${blessing.route=='/'}" th:href="${siteAssets.cdn+'/app/home.css'}" crossorigin="anonymous">
    <link rel="stylesheet" th:if="${siteAssets.css}" th:href="@{/official/site/custom.css}">
    <script th:inline="javascript">window.blessing = /*[[${blessing}]]*/ {};</script>
</head>
<body>
<th:block th:fragment="scripts">
    <script th:inline="javascript">
        const extra = /*[[${extra}]]*/ {};
        const data = document.createElement('script');
        data.id = 'blessing-extra';
        data.type = 'application/json';
        data.textContent = JSON.stringify(extra);
        document.body.appendChild(data);
    </script>
    <script th:src="${siteAssets.cdn+'/app/app.js'}" crossorigin="anonymous"></script>
    <script th:if="${blessing.route=='/'}" th:src="${siteAssets.cdn+'/app/home.js'}" crossorigin="anonymous"></script>
    <script th:if="${hitokotoEnabled and (#strings.startsWith(blessing.route,'user') or #strings.startsWith(blessing.route,'admin'))}" th:src="@{/official/hitokoto.js}"></script>
    <th:block th:if="${xiqueerEnabled and #strings.startsWith(blessing.route,'user')}">
        <script th:src="@{/official/xiqueer/qrcode.min.js}"></script>
        <script th:src="@{/official/xiqueer/modal.js}"></script>
        <script th:if="${blessing.route=='user/xiqueer-verification'}" th:src="@{/official/xiqueer/verify.js}"></script>
    </th:block>
    <script th:if="${siteAssets.js}" th:src="@{/official/site/custom.js}"></script>
</th:block>
</body>
</html>

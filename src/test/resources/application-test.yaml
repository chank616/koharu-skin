spring:
  datasource:
    url: jdbc:h2:mem:koharu;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:account-schema.sql,classpath:db/yggdrasil.sql,classpath:db/oauth.sql
koharu:
  remember-key: local-test-key-not-for-deployment
